name: bondgrid
description: The simplest way to invest in US Treasury Bills.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.46+46

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  device_preview: ^1.1.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  another_flushbar: ^1.12.30
  otp_timer_button: ^1.1.0
  intl_phone_field: ^3.2.0
  intl: ^0.19.0
  keyboard_actions: ^4.2.0
  localstorage: ^4.0.1+4
  http: ^1.2.1
  fluttertoast: ^8.2.2
  flutter_launcher_icons: ^0.13.1
  flutter_easyloading: ^3.0.5
  jaguar_jwt: ^3.0.0
  url_launcher: ^6.1.11
  plaid_flutter: ^3.1.2
  convex_bottom_bar: ^3.2.0
  smooth_page_indicator: ^1.1.0
  shared_preferences: ^2.2.0
  mask_text_input_formatter: ^2.7.0
  flutter_svg: ^2.0.10+1
  firebase_messaging: ^14.7.9
  firebase_core: ^2.24.2
  flutter_local_notifications: ^17.0.0
  package_info_plus: ^4.2.0
  appsflyer_sdk: ^6.4.0
  share_plus: ^7.2.1
  flutter_keyboard_visibility: ^6.0.0
  shimmer: ^3.0.0
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  tuple: ^2.0.2

  # connectivity -- Network connection checkup
  connectivity_plus: ^3.0.3
  # For service locator
  get_it: ^7.2.0
  # To handle di
  injectable: ^2.4.4
  # Beautiful logging in terminal
  logger: ^1.1.0
  # rxdart for reactive programming
  rxdart: ^0.27.2

dev_dependencies:
  build_runner: ^2.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  injectable_generator: ^2.6.2


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - lib/assets/

fonts:
  - family: Maison Neue
    fonts:
      - asset: lib/fonts/MaisonNeue-Bold.ttf
        weight: 700
      - asset: lib/fonts/MaisonNeue-Demi.ttf
        weight: 600
      - asset: lib/fonts/MaisonNeue-Medium.ttf
        weight: 500
      - asset: lib/fonts/MaisonNeue-Book.ttf
        weight: 400
      - asset: lib/fonts/MaisonNeue-Light.ttf
        weight: 300

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/reverse-logo.png"
